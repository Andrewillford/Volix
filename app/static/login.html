<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — LogHub</title>
<link rel="stylesheet" href="/static/volix.css" />
<style>
  /* Página de login: sem sidebar, cartão centralizado. */
  body { padding-left: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-wrap { width: 100%; max-width: 400px; padding: 24px; }
  .brand-box { text-align: center; margin-bottom: 22px; }
  .brand-box .volix { font-size: 40px; font-weight: 800; letter-spacing: 9px; color: #fff; line-height: 1; }
  .brand-box .volix b { color: var(--volix); }
  .brand-box .glow { height: 2px; width: 60%; margin: 12px auto 0; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--volix), transparent); box-shadow: 0 0 10px var(--volix); }
  .brand-box .tag { margin-top: 12px; font-size: 9px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 26px 24px; }
  .card h1 { margin: 0 0 4px; font-size: 18px; }
  .card p.sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 11px 12px; font-size: 14px; }
  .field input:focus { outline: none; border-color: var(--volix); }
  button.entrar { width: 100%; background: var(--volix); color: #0a0d12; border: none; padding: 12px;
    border-radius: 7px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  button.entrar:hover { filter: brightness(1.06); }
  button.entrar:disabled { opacity: .6; cursor: not-allowed; }
  .erro { background: var(--bad-bg); color: var(--bad); border-radius: 7px; padding: 10px 12px;
    font-size: 13px; margin-bottom: 14px; display: none; }
  .hint { margin-top: 16px; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand-box">
      <div class="volix">Log<b>H</b>ub</div>
      <div class="glow"></div>
      <div class="tag">Sua logística num só lugar</div>
    </div>
    <div class="card">
      <div id="erro" class="erro"></div>

      <!-- Login normal -->
      <form id="loginForm">
        <h1>Entrar</h1>
        <p class="sub">Relatórios Gerais de Logística</p>
        <div class="field">
          <label for="login">Usuário</label>
          <input id="login" name="login" autocomplete="username" autofocus />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" />
        </div>
        <button type="submit" class="entrar">Entrar</button>
      </form>

      <!-- Primeiro acesso: criar administrador -->
      <form id="setupForm" style="display:none;">
        <h1>Primeiro acesso</h1>
        <p class="sub">Nenhum usuário cadastrado ainda. Crie o administrador do sistema.</p>
        <div class="field">
          <label for="sNome">Nome</label>
          <input id="sNome" autocomplete="name" />
        </div>
        <div class="field">
          <label for="sLogin">Usuário (login)</label>
          <input id="sLogin" autocomplete="username" />
        </div>
        <div class="field">
          <label for="sSenha">Senha (mín. 4 caracteres)</label>
          <input id="sSenha" type="password" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="sSenha2">Confirmar senha</label>
          <input id="sSenha2" type="password" autocomplete="new-password" />
        </div>
        <button type="submit" class="entrar">Criar administrador e entrar</button>
      </form>
    </div>
    <div class="hint">Acesso restrito · fale com o administrador se precisar de um login.</div>
  </div>

<script>
const $ = s => document.querySelector(s);
const erroBox = $('#erro');
function erro(msg) { erroBox.textContent = msg; erroBox.style.display = msg ? 'block' : 'none'; }

async function init() {
  try {
    const st = await fetch('/api/auth/status').then(r => r.json());
    if (st.authenticated) { location.href = '/home'; return; }
    if (st.precisa_setup) {
      $('#loginForm').style.display = 'none';
      $('#setupForm').style.display = 'block';
      $('#sNome').focus();
    }
  } catch (e) { /* servidor fora — deixa o form de login mesmo */ }
}

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); erro('');
  const btn = e.target.querySelector('button'); btn.disabled = true;
  try {
    const resp = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: $('#login').value, senha: $('#senha').value }),
    });
    if (resp.ok) { location.href = '/home'; return; }
    erro(resp.status === 401 ? 'Usuário ou senha inválidos.' : 'Não foi possível entrar. Tente novamente.');
  } catch (e2) { erro('Falha de conexão com o servidor.'); }
  finally { btn.disabled = false; }
});

$('#setupForm').addEventListener('submit', async (e) => {
  e.preventDefault(); erro('');
  if ($('#sSenha').value !== $('#sSenha2').value) { erro('As senhas não conferem.'); return; }
  if ($('#sSenha').value.length < 4) { erro('A senha deve ter ao menos 4 caracteres.'); return; }
  const btn = e.target.querySelector('button'); btn.disabled = true;
  try {
    const resp = await fetch('/api/setup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: $('#sLogin').value, nome: $('#sNome').value, senha: $('#sSenha').value }),
    });
    if (resp.ok) { location.href = '/home'; return; }
    const d = await resp.json().catch(() => ({}));
    erro((d && d.detail) || 'Não foi possível criar o administrador.');
  } catch (e2) { erro('Falha de conexão com o servidor.'); }
  finally { btn.disabled = false; }
});

init();
</script>

<!-- No login (fora da sidebar escura), o wordmark precisa de cor legível no tema claro:
     grafite nas letras e verde técnico no destaque (verde Volix não vai em texto). -->
<style>
  :root[data-theme="light"] .brand-box .volix { color: #141816; }
  :root[data-theme="light"] .brand-box .volix b { color: #00875f; }
</style>

<!-- Tema claro/escuro (Volix): aplica o salvo e injeta o botão de alternância. -->
<script>
(function () {
  var KEY = 'loghub-theme', root = document.documentElement;
  var at = function () { return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; };
  var ap = function (t) { root.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); };
  try { ap(localStorage.getItem(KEY)); } catch (e) { ap('dark'); }
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'theme-toggle'; b.id = 'themeToggle';
  var pinta = function () { var c = at() === 'light'; b.textContent = c ? '🌙' : '☀️'; b.title = c ? 'Mudar para o tema escuro' : 'Mudar para o tema claro'; b.setAttribute('aria-label', b.title); };
  b.addEventListener('click', function () { var p = at() === 'light' ? 'dark' : 'light'; ap(p); try { localStorage.setItem(KEY, p); } catch (e) {} pinta(); });
  document.body.appendChild(b); pinta();
})();
</script>
</body>
</html>
